<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <rect width="780" height="460" rx="18" fill="#f7fafd"/>
  <defs>
    <marker id="arrow-both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6690"/>
    </marker>
  </defs>

  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#16324f" text-anchor="middle">
    <text x="390" y="46" font-size="22" font-weight="bold">联邦学习：数据不出本地，只聚合模型参数</text>

    <rect x="290" y="170" width="200" height="110" rx="16" fill="#eaf2f9" stroke="#2f6690" stroke-width="2"/>
    <text x="390" y="216" font-size="19" font-weight="bold">全局模型聚合</text>
    <text x="390" y="246" font-size="15" fill="#6b7f92">只接收参数，不接收原始数据</text>

    <g>
      <rect x="40" y="60" width="190" height="96" rx="14" fill="#ffffff" stroke="#2f6690" stroke-width="2"/>
      <text x="135" y="100" font-size="19">医院 A</text>
      <text x="135" y="130" font-size="14" fill="#6b7f92">原始数据不出本地</text>
    </g>
    <g>
      <rect x="550" y="60" width="190" height="96" rx="14" fill="#ffffff" stroke="#2f6690" stroke-width="2"/>
      <text x="645" y="100" font-size="19">医院 B</text>
      <text x="645" y="130" font-size="14" fill="#6b7f92">原始数据不出本地</text>
    </g>
    <g>
      <rect x="295" y="340" width="190" height="96" rx="14" fill="#ffffff" stroke="#2f6690" stroke-width="2"/>
      <text x="390" y="380" font-size="19">医院 C</text>
      <text x="390" y="410" font-size="14" fill="#6b7f92">原始数据不出本地</text>
    </g>

    <g stroke="#2f6690" stroke-width="3" fill="none">
      <path d="M230 108 C280 108 300 170 330 190" marker-end="url(#arrow-both)"/>
      <path d="M550 108 C500 108 480 170 450 190" marker-end="url(#arrow-both)"/>
      <path d="M390 340 C390 310 390 300 390 282" marker-end="url(#arrow-both)"/>
    </g>

    <text x="180" y="170" font-size="15" fill="#d9a441">仅上传模型参数</text>
    <text x="520" y="170" font-size="15" fill="#d9a441">仅上传模型参数</text>
    <text x="470" y="322" font-size="15" fill="#d9a441">仅上传模型参数</text>
  </g>
