<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习技能树 · 医学AI学习卡片</title>
  <meta name="description" content="一个纯前端的学习与复习平台：内容包管理、概念卡片、碎片式答题、复习抽检、刷卡学习与本地进度。" />
  <meta name="theme-color" content="#16324f" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <!-- 链接分享预览 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="学习技能树 · 医学AI学习卡片" />
  <meta property="og:description" content="概念卡片 + 碎片式答题 + 复习抽检 + 刷卡学习，纯前端实现的学习与复习平台。" />
  <meta property="og:url" content="https://sien-1.github.io/public-demo/" />
  <meta property="og:image" content="https://sien-1.github.io/public-demo/assets/doubao-3.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="学习技能树 · 医学AI学习卡片" />
  <meta name="twitter:description" content="内容包管理 + 概念卡片 + 碎片式答题 + 复习抽检 + 刷卡学习。" />
  <meta name="twitter:image" content="https://sien-1.github.io/public-demo/assets/doubao-3.jpg" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 内容包选择页（有多个内容包时供选择，平时只有一个会自动进入） -->
  <div id="pack-screen">
    <div class="pack-box">
      <div class="pack-hero">
        <img class="pack-logo" src="assets/logo.svg" alt="学习技能树标志" />
        <div class="pack-hero-copy">
          <h1>学习技能树</h1>
          <p class="small-muted">把课程内容做成可刷、可测、可复习的知识卡片。<br />每个学科是独立内容包，进度互不干扰。</p>
        </div>
      </div>
      <img class="pack-banner" src="assets/doubao-3.jpg" alt="医学与 AI 学习插画" />
      <div id="pack-list"></div>
    </div>
  </div>

  <h1 id="app-title"></h1>
  <button id="mobile-back-btn" class="mobile-back-btn" type="button">← 返回内容包</button>

  <!-- 顶部总进度 -->
  <div class="progress-card">
    <div class="progress-head">
      <p id="progress-text">已完成 0 / 0 · 当前经验 0 / 0</p>
      <button id="switch-pack-btn">切换内容包</button>
      <button id="reset-btn" title="清空所有进度，从头开始">重置进度</button>
    </div>
    <div class="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <!-- 复习抽检提醒横幅（有待完成的抽检时显示） -->
  <div id="review-banner" class="review-banner hidden">
    <p id="review-banner-text"></p>
    <button id="review-banner-btn">去复习</button>
  </div>

  <!-- 小工具入口 -->
  <a class="tools-link" href="tools/tomato-clock/index.html" target="_blank" rel="noopener">
    🍅 打开番茄钟（自定义目标）
  </a>

  <button id="pack-review-btn" class="pack-review-btn hidden"></button>

  <!-- 搜索：按名称或讲解内容过滤技能卡片 -->
  <input id="search-input" class="search-box" type="search" placeholder="搜索技能或概念…" autocomplete="off" />

  <!-- 技能卡片会由 JS 生成到这里 -->
  <div id="skill-list"></div>

  <!-- 详情弹窗：先看概念，再“开始答题” -->
  <div id="detail-overlay" class="overlay hidden">
    <div class="detail-box">
      <button id="close-btn" title="关闭">×</button>

      <div class="detail-body">
        <!-- 刷卡模式控制条：非刷卡时隐藏 -->
        <div id="deck-header" class="deck-header hidden">
          <button id="deck-prev-btn" class="deck-nav-btn" title="上一张">←</button>
          <span id="deck-progress"></span>
          <button id="deck-next-btn" class="deck-nav-btn" title="下一张">→</button>
        </div>

        <h2 id="detail-name"></h2>
        <p id="detail-exp"></p>

        <!-- 第 1 步：概念讲解 -->
        <div id="concept-step">
          <h3>概念讲解</h3>
          <img id="concept-figure" class="figure clickable hidden" alt="概念示意图" title="点击放大" />
          <p id="detail-concept"></p>
          <div id="detail-sections"></div>
          <button id="start-quiz-btn" class="primary-btn">开始答题 →</button>
        </div>

        <!-- 第 2 步：题目与提交 -->
        <div id="quiz-step" class="hidden">
          <h3>练习题</h3>
          <p id="detail-question"></p>
          <img id="question-figure" class="figure clickable hidden" alt="题目示意图" title="点击放大" />

          <!-- 碎片式答题：题目配置了 answerSchema 时显示 -->
          <div id="builder-answer-area" class="hidden">
            <div id="answer-builder" class="answer-builder"></div>
            <div id="answer-keypad" class="keypad">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key=".">.</button>
            <button type="button" data-key="0">0</button>
            <button type="button" data-key="minus">−</button>
            <button type="button" data-key="clear" class="key-func key-wide">清空</button>
            </div>
          </div>

          <!-- 文字输入兜底：题目没有 answerSchema 时显示 -->
          <div id="text-answer-area">
            <p class="small-muted">把算出的最终答案写在下面（不用写计算过程），然后提交。</p>
            <input id="answer-input" type="text" placeholder="例如：3i+4j m/s" autocomplete="off" />
          </div>

          <button id="submit-btn" class="primary-btn">提交答案</button>
          <button id="quiz-done-btn" class="primary-btn hidden">完成</button>

          <p id="feedback"></p>

          <button id="show-answer-btn" class="ghost-btn hidden">查看参考答案</button>
          <div id="answer-reveal" class="hidden">
            <p class="small-muted">参考答案（查看答案不会获得经验）：</p>
            <p id="detail-answer"></p>
          </div>

          <button id="back-btn" class="link-btn">← 返回概念</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 复习抽检弹窗 -->
  <div id="review-overlay" class="overlay hidden">
    <div class="detail-box">
      <button id="review-close-btn" title="先跳过">×</button>

      <h2>复习抽检 ⚡</h2>
      <p id="review-note" class="small-muted"></p>

      <h3>练习题</h3>
      <p id="review-question"></p>

      <!-- 复习题也支持碎片式答题 -->
      <div id="review-builder-answer-area" class="hidden">
        <div id="review-answer-builder" class="answer-builder"></div>
        <div id="review-keypad" class="keypad">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key=".">.</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="minus">−</button>
          <button type="button" data-key="clear" class="key-func key-wide">清空</button>
        </div>
      </div>

      <!-- 文字输入兜底 -->
      <div id="review-text-answer-area">
        <p class="small-muted">凭记忆作答，不显示概念。把算出的最终答案写在下面；答错会暂时扣经验，答对即可恢复。</p>
        <input id="review-input" type="text" placeholder="输入你的最终答案" autocomplete="off" />
      </div>
      <button id="review-submit-btn" class="primary-btn">提交答案</button>

      <p id="review-feedback"></p>

      <button id="review-done-btn" class="ghost-btn hidden">完成</button>
      <button id="review-skip-btn" class="link-btn">先跳过（之后可从顶部横幅继续）</button>
    </div>
  </div>

  <!-- 图片放大预览 -->
  <div id="image-preview" class="image-preview hidden">
    <img id="image-preview-img" alt="放大预览" />
  </div>

  <script src="app.js"></script>
</body>
</html>
