<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="学习卡片与知识网络插画">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#f7fafd"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7fc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="360" rx="20" fill="url(#bg)"/>

  <!-- 知识网络 -->
  <g stroke="#a7c3e0" stroke-width="2" fill="none" opacity="0.9">
    <path d="M120 96 L210 62 M120 96 L196 156 M210 62 L300 92 M196 156 L300 92"/>
    <path d="M470 250 L545 214 M470 250 L520 306 M545 214 L582 268 M520 306 L582 268"/>
  </g>
  <g>
    <circle cx="120" cy="96" r="9" fill="#1f3a5f"/>
    <circle cx="210" cy="62" r="7" fill="#3a6ea5"/>
    <circle cx="196" cy="156" r="7" fill="#3a6ea5"/>
    <circle cx="300" cy="92" r="9" fill="#e0b968"/>
    <circle cx="470" cy="250" r="9" fill="#1f3a5f"/>
    <circle cx="545" cy="214" r="7" fill="#3a6ea5"/>
    <circle cx="520" cy="306" r="7" fill="#3a6ea5"/>
    <circle cx="582" cy="268" r="9" fill="#e0b968"/>
  </g>

  <!-- 卡片堆 -->
  <g transform="translate(258 96) rotate(-6)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="#dfe9f3"/>
  </g>
  <g transform="translate(248 86)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="url(#cardA)" stroke="#d8e2ec"/>
    <rect x="22" y="26" width="120" height="12" rx="6" fill="#3a6ea5" opacity="0.85"/>
    <rect x="22" y="52" width="176" height="8" rx="4" fill="#cbd9e8"/>
    <rect x="22" y="70" width="150" height="8" rx="4" fill="#cbd9e8"/>
    <rect x="22" y="96" width="86" height="26" rx="13" fill="#1f3a5f"/>
    <circle cx="182" cy="109" r="12" fill="#e0b968"/>
  </g>

  <!-- 医学十字 -->
  <g transform="translate(214 232)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#ffffff" stroke="#e0b968"/>
    <rect x="21" y="10" width="10" height="32" rx="4" fill="#e0b968"/>
    <rect x="10" y="21" width="32" height="10" rx="4" fill="#e0b968"/>
  </g>
</svg>
